name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The UI is a Vite build embedded into the binary, so every job that
      # compiles a binary for use needs Node and the locked dependencies.
      # pnpm comes from the packageManager field in ui/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # Test before Build: `go test ./...` compiles every package anyway, so a
      # broken build fails here with the test signal rather than without it.
      - name: Test
        run: make test

      - name: Type-check and lint the UI
        run: make ui-lint

      # make build runs the UI build first, so the binary carries the real UI
      # and a frontend that no longer compiles fails here.
      - name: Build
        run: make build

      - name: Lint
        run: make lint

      # The wallet's dependencies include two chain SDKs and their transitive
      # cryptography, so "is there an advisory anywhere in the graph" is the
      # wrong question and always answered yes. govulncheck answers the useful
      # one — whether this code reaches the vulnerable symbol — and only that
      # is worth failing a build over.
      - name: Vulnerabilities
        run: make vuln

      # A broken release configuration is otherwise only noticed while a tag is
      # being published, when the tag is already public. `check` also fails on
      # deprecated options, so this is what keeps the config current.
      - name: Check the release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
