name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Two releases running at once would race on the cask commit.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish and update the cask
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so GoReleaser can build the changelog from the full
      # history. The cask commit does not come from this checkout — GoReleaser
      # writes it through the GitHub API with the token set below, so this
      # checkout can stay detached at the tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # GoReleaser normally looks for the nearest reachable tag. If published
      # history was rewritten, that can silently skip several versions and put
      # every commit since an old tag into the changelog. Select the previous
      # version explicitly and require it to be an ancestor instead.
      - name: Verify release history
        shell: bash
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          if ! previous_tag="$(
            git tag --list 'v[0-9]*' --sort=-version:refname |
              awk -v current="$CURRENT_TAG" '
                found { print; exit }
                $0 == current { found = 1 }
                END { if (!found) exit 1 }
              '
          )"; then
            echo "Current tag $CURRENT_TAG was not fetched" >&2
            exit 1
          fi

          if [[ -n "$previous_tag" ]]; then
            if ! git merge-base --is-ancestor "$previous_tag^{commit}" "$CURRENT_TAG^{commit}"; then
              echo "Previous release $previous_tag is not an ancestor of $CURRENT_TAG." >&2
              echo "The branch was rewritten after $previous_tag; refusing to publish an incorrect changelog." >&2
              exit 1
            fi
            echo "GORELEASER_PREVIOUS_TAG=$previous_tag" >> "$GITHUB_ENV"
          fi

      # Before publishing, not after: a tag that fails its tests should not reach
      # the release page or the tap.
      - name: Test
        run: make test

      # Pinned to the v2 series: the cask is generated by GoReleaser, and a major
      # bump may change or drop configuration this file relies on. Only the
      # built-in GITHUB_TOKEN is used — the tap is this same repository, so there
      # is no cross-repository secret to configure.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
