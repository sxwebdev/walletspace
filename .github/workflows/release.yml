name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Two releases running at once would race on the cask commit.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish and update the cask
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so GoReleaser can build the changelog from the full
      # history. The cask commit does not come from this checkout — GoReleaser
      # writes it through the GitHub API with the token set below, so this
      # checkout can stay detached at the tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Before publishing, not after: a tag that fails its tests should not reach
      # the release page or the tap.
      - name: Test
        run: make test

      # Pinned to the v2 series: the cask is generated by GoReleaser, and a major
      # bump may change or drop configuration this file relies on. Only the
      # built-in GITHUB_TOKEN is used — the tap is this same repository, so there
      # is no cross-repository secret to configure.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
